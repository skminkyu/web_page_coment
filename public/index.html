<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상세페이지 주석 검토</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<!-- ═════════ 대시보드 ═════════ -->
<div id="dashView">
  <header class="appbar">
    <div class="brand"><div class="brand-mark">✎</div>상세페이지 주석 검토</div>
    <div class="spacer"></div>
    <button class="backup-chip" id="backupChip" title="백업 관리"><span class="dot"></span><span id="backupChipText">백업 상태 확인 중…</span></button>
  </header>
  <div id="globalBanners"></div>

  <main class="dash">
    <div class="dash-head">
      <h1 class="dash-title">제품 목록<span class="count" id="productCount"></span></h1>
      <div class="spacer"></div>
      <div class="search"><input class="input" id="searchInput" type="search" placeholder="제품명 검색" /></div>
      <div class="seg" id="filterSeg">
        <button data-filter="all" class="active">전체</button>
        <button data-filter="progress">진행 중</button>
        <button data-filter="done">완료</button>
      </div>
      <button class="btn btn-icon" id="refreshBtn" title="새로고침">↻</button>
      <button class="btn" id="trashBtn">🗑 휴지통</button>
      <button class="btn btn-primary" id="newProductBtn">＋ 제품 추가</button>
    </div>
    <div id="productGrid" class="product-grid"></div>
  </main>
</div>

<!-- ═════════ 에디터 ═════════ -->
<div id="editorView" class="editor hidden">
  <div id="editorBanners"></div>
  <div class="ed-top">
    <button class="btn btn-sm" id="backBtn">← 목록</button>
    <div class="ed-title">
      <h1 id="edTitle"></h1>
      <button class="btn btn-sm btn-ghost btn-icon" id="renameBtn" title="제품명 변경">✏️</button>
    </div>
    <div class="vsep"></div>
    <div class="round-tabs" id="roundTabs"></div>
    <button class="btn btn-sm" id="addRoundBtn">＋ 차수</button>
    <div class="spacer"></div>
    <span class="save-status" id="saveStatus"></span>
    <button class="btn btn-sm" id="historyBtn" title="이 차수의 이전 저장 버전 보기">🕘 버전 기록</button>
    <button class="btn btn-sm" id="completeBtn"></button>
    <button class="btn btn-sm" id="shareBtn">🔗 공유 링크</button>
    <button class="btn btn-sm btn-primary" id="saveBtn" title="저장 (Ctrl+S)">💾 저장</button>
  </div>

  <div class="ed-tools" id="edTools">
    <div class="tool-group">
      <span class="tool-label">도구</span>
      <div class="seg" id="toolSeg">
        <button data-tool="box" class="active" title="드래그해서 영역 지정 (B)">▭ 박스</button>
        <button data-tool="pin" title="클릭해서 지점 지정 (P)">📍 핀</button>
      </div>
    </div>
    <div class="tool-group">
      <span class="tool-label">색상</span>
      <div class="colors" id="colorPicker">
        <button class="color-dot active" data-color="#e5484d" style="background:#e5484d" title="빨강"></button>
        <button class="color-dot" data-color="#f5a524" style="background:#f5a524" title="주황"></button>
        <button class="color-dot" data-color="#3d7bfd" style="background:#3d7bfd" title="파랑"></button>
        <button class="color-dot" data-color="#18a76f" style="background:#18a76f" title="초록"></button>
        <button class="color-dot" data-color="#8b5cf6" style="background:#8b5cf6" title="보라"></button>
      </div>
    </div>
    <div class="vsep"></div>
    <div class="tool-group">
      <button class="btn btn-sm" id="addFilesBtn" title="이미지·HTML·소스코드 파일 추가 (여러 개 가능)">＋ 파일 추가</button>
      <button class="btn btn-sm" id="replaceBtn" title="현재 페이지 파일만 교체 (주석 유지)">⇄ 현재 교체</button>
      <button class="btn btn-sm" id="pasteTextBtn" title="소스코드나 텍스트를 직접 붙여넣기">⌨ 텍스트 입력</button>
      <div class="url-box">
        <input class="input" id="urlInput" placeholder="이미지 URL 붙여넣기" />
        <button class="btn btn-sm" id="urlAddBtn">URL 추가</button>
      </div>
      <button class="btn btn-sm btn-danger" id="deletePageBtn" title="현재 페이지 삭제">페이지 삭제</button>
    </div>
    <div class="spacer" style="flex:1"></div>
    <div class="page-nav" id="pageNav">
      <button class="btn btn-sm btn-icon" id="prevBtn" title="이전 페이지">‹</button>
      <span id="pageLabel">0 / 0</span>
      <button class="btn btn-sm btn-icon" id="nextBtn" title="다음 페이지">›</button>
    </div>
    <input type="file" id="fileInput" multiple class="hidden"
      accept="image/*,.avif,.html,.htm,.css,.js,.mjs,.ts,.jsx,.tsx,.vue,.txt,.json,.md,.xml,.scss,.less,.svelte" />
  </div>

  <div class="thumbs hidden" id="thumbs"></div>

  <div class="ed-main">
    <div class="canvas-area" id="canvasArea">
      <div class="locked-banner hidden" id="lockedBanner">
        ✅ 이 차수는 완료 처리되어 읽기 전용입니다.
        <button class="btn btn-sm" id="unlockBtn" style="margin-left:auto">완료 취소하고 수정하기</button>
      </div>
      <div class="canvas-inner">
        <div class="dropzone hidden" id="dropzone">
          <div class="icon">📁</div>
          <h3>클릭하거나 파일을 끌어다 놓으세요</h3>
          <p>이미지(JPG·PNG·GIF·WEBP·AVIF) 여러 장 · HTML 파일 · 소스코드/텍스트 파일<br>
             이미지는 <b>Ctrl+V</b>로 붙여넣을 수도 있습니다. 파일당 최대 <span id="maxMbLabel">30</span>MB</p>
        </div>
        <div class="stage hidden" id="stage">
          <div id="contentHolder"></div>
          <div class="overlay editable" id="overlay"></div>
        </div>
      </div>
      <div class="loading-mask hidden" id="loadingMask"><div class="spinner"></div></div>
    </div>

    <aside class="sidebar">
      <div class="sb-head">
        <h2>주석</h2><span class="sub" id="annCount">0개</span>
        <div style="flex:1"></div>
        <span class="sub" id="roundAnnSummary"></span>
      </div>
      <div class="sb-list" id="annList"></div>
    </aside>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
