<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>상세페이지 검토 결과</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .v-head { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .v-head h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
    .v-state { flex: 1; display: grid; place-items: center; color: var(--text-3); text-align: center; padding: 40px; }
  </style>
</head>
<body>
<div class="editor">
  <div class="v-head">
    <div class="brand-mark" style="width:28px;height:28px;font-size:14px">✎</div>
    <h1 id="vTitle">검토 결과</h1>
    <span class="pill">🔒 읽기 전용</span>
    <div class="vsep"></div>
    <div class="round-tabs" id="vRounds"></div>
    <span id="vDone"></span>
    <div style="flex:1"></div>
    <div class="page-nav hidden" id="vNav">
      <button class="btn btn-sm btn-icon" id="vPrev">‹</button>
      <span id="vLabel"></span>
      <button class="btn btn-sm btn-icon" id="vNext">›</button>
    </div>
  </div>
  <div class="thumbs hidden" id="vThumbs"></div>
  <div class="ed-main" id="vMain">
    <div class="canvas-area" id="vArea">
      <div class="canvas-inner">
        <div class="v-state" id="vState"><div><div class="spinner" style="margin:0 auto 12px"></div>불러오는 중…</div></div>
        <div class="stage hidden" id="vStage">
          <div id="vContent"></div>
          <div class="overlay readonly" id="vOverlay"></div>
        </div>
      </div>
    </div>
    <aside class="sidebar">
      <div class="sb-head"><h2>주석</h2><span class="sub" id="vCount">0개</span></div>
      <div class="sb-list" id="vList"></div>
    </aside>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/viewer.js"></script>
</body>
</html>
